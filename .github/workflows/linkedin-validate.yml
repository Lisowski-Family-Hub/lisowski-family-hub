name: LinkedIn / Validate drafts

on:
  pull_request:
    paths:
      - 'linkedin-agent/drafts/**'
      - 'linkedin-agent/published/**'
      - 'linkedin-agent/scripts/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lint all pending drafts
        run: node linkedin-agent/scripts/validate.js
