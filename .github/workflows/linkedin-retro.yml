name: LinkedIn / Weekly retro

on:
  schedule:
    # Saturday 14:00 UTC = 9 AM Central during daylight time.
    - cron: '0 14 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  id-token: write
  actions: read

jobs:
  retro:
    runs-on: ubuntu-latest
    concurrency:
      group: linkedin-retro
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Collect metrics from the drop-box issue
        id: metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create linkedin-metrics --force --color 1D76DB \
            --description "Drop-box for LinkedIn post metrics" || true
          num=$(gh issue list --label linkedin-metrics --state open --json number --jq '.[0].number')
          if [ -z "$num" ]; then
            url=$(gh issue create --title "LinkedIn metrics drop-box" --label linkedin-metrics \
              --body "Paste post metrics here whenever convenient (impressions, reactions, comments, and which post they belong to — a date or a first line is enough). The Saturday retro reads every comment on this issue and folds the numbers into linkedin-agent/performance/log.md, which sharpens the next batch of drafts. Keep this issue open.")
            num="${url##*/}"
            echo "Created metrics drop-box issue #$num"
          fi
          gh issue view "$num" --comments > linkedin-agent/performance/.metrics-inbox.md
          echo "issue=$num" >> "$GITHUB_OUTPUT"

      - name: Run the retro with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--allowedTools "Read,Write,Glob,Grep"'
          prompt: |
            You are the retrospective engine of a LinkedIn leadership agent.

            Read:
            1. linkedin-agent/performance/.metrics-inbox.md — the metrics drop-box issue
              and all its comments (may be empty or contain informal notes).
            2. linkedin-agent/performance/log.md — the running performance log.
            3. Files in linkedin-agent/published/ from the last 14 days, if any.

            Then append one new dated section to linkedin-agent/performance/log.md:
            - Add any new metrics to the "Post log" table (one row per post: date,
              pillar, hook, impressions, reactions, comments — leave unknown cells
              blank). Do not duplicate rows that are already recorded.
            - Under "Lessons learned", add 1-3 bullets that a future drafting run can
              act on (which pillars/hooks/structures over- or under-performed). Only
              state what the data supports; with no new data, write a single bullet
              noting no metrics were provided this week.

            Do not modify any file other than linkedin-agent/performance/log.md.

      - name: Commit the updated performance log
        run: |
          rm -f linkedin-agent/performance/.metrics-inbox.md
          if ! git diff --quiet linkedin-agent/performance/log.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add linkedin-agent/performance/log.md
            git commit -m "Weekly LinkedIn performance retro"
            git push origin main
          else
            echo "Retro produced no log changes to commit."
          fi

      - name: Open or update an alert issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create linkedin-agent-alert --force --color D93F0B \
            --description "LinkedIn agent needs attention" || true
          body="The Saturday retro workflow failed, so the performance log was not updated.

          Run log: $RUN_URL"
          existing=$(gh issue list --label linkedin-agent-alert --state open \
            --search "LinkedIn retro failed in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "LinkedIn retro failed" \
              --label linkedin-agent-alert --body "$body"
          fi
