name: LinkedIn / Token sentinel

on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check the LinkedIn access token
        id: check
        continue-on-error: true
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: node linkedin-agent/scripts/check-token.js

      - name: Close the alert issue when the token is healthy
        if: steps.check.outputs.status == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --label linkedin-agent-alert --state open \
            --search "LinkedIn token needs attention in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue close "$existing" \
              --comment "The daily token check passed again — closing this alert."
          fi
          echo "Token healthy."

      - name: Open or update the alert issue
        if: steps.check.outputs.status != 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ steps.check.outputs.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create linkedin-agent-alert --force --color D93F0B \
            --description "LinkedIn agent needs attention" || true
          body="${MSG:-The token check crashed before producing a message.}

          Run log: $RUN_URL
          Renewal instructions: linkedin-agent/SETUP.md"
          existing=$(gh issue list --label linkedin-agent-alert --state open \
            --search "LinkedIn token needs attention in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "LinkedIn token needs attention" \
              --label linkedin-agent-alert --body "$body"
          fi
